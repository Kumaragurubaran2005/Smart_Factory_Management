<!DOCTYPE html>
<html>

<head>
    <title>Truck Driver Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary">
    <div class="container mt-5">
        <div class="card mx-auto" style="max-width: 500px;">
            <div class="card-header bg-dark text-white">
                <h4>Truck Driver Login</h4>
            </div>
            <div class="card-body">
                <form id="truckForm">
                    <div class="mb-3">
                        <label>Truck ID</label>
                        <input type="text" id="truck_id" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Driver Name</label>
                        <input type="text" id="driver_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Capacity (kg)</label>
                        <input type="number" id="capacity" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('truckForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                truck_id: document.getElementById('truck_id').value,
                driver_name: document.getElementById('driver_name').value,
                capacity: parseFloat(document.getElementById('capacity').value)
            };
            const res = await fetch('/api/truck/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const json = await res.json();
            if (json.message) {
                document.getElementById('result').innerHTML = `<div class="alert alert-success">${json.message}</div>`;
                document.getElementById('truckForm').reset();
            } else {
                document.getElementById('result').innerHTML = `<div class="alert alert-danger">${json.error}</div>`;
            }
        });
    </script>
</body>

</html>
