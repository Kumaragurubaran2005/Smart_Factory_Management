<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neural Factory · Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020C18 0%, #071428 60%, #0D1F3C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D0E8FF;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(10, 22, 44, 0.85);
            backdrop-filter: blur(18px);
            border-radius: 32px;
            border: 1px solid rgba(59, 158, 255, 0.2);
            padding: 40px 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
            transition: all 0.2s;
        }

        .login-card:hover {
            border-color: rgba(59, 158, 255, 0.5);
            box-shadow: 0 25px 45px -8px rgba(59, 158, 255, 0.2);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #3B9EFF, #AA44FF);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .brand p {
            font-size: 0.8rem;
            color: #6A8FAD;
            margin-top: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8AAED0;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(5, 15, 35, 0.8);
            border: 1px solid rgba(59, 158, 255, 0.2);
            border-radius: 16px;
            color: #D0E8FF;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #3B9EFF;
            background: rgba(5, 15, 35, 0.95);
            box-shadow: 0 0 0 2px rgba(59, 158, 255, 0.2);
        }

        select option {
            background: #0A162C;
            color: #D0E8FF;
        }

        .extra-fields {
            display: none;
            overflow: hidden;
            animation: slideDown 0.25s ease;
        }

        .extra-fields.visible {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 14px;
            background: rgba(59, 158, 255, 0.12);
            color: #7BD4FF;
            border: 1px solid rgba(59, 158, 255, 0.25);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(95deg, #1F3147, #0F1A28);
            border: 1px solid #3B9EFF;
            border-radius: 44px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #7BD4FF;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }

        button:hover {
            background: #2B9EFF;
            color: black;
            box-shadow: 0 0 12px #2B9EFF;
            transform: translateY(-1px);
            border-color: white;
        }

        button:active {
            transform: translateY(1px);
        }

        .error {
            background: rgba(255, 68, 85, 0.15);
            border-left: 3px solid #FF4455;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #FF8899;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .hint {
            font-size: 0.7rem;
            color: #4A6A8A;
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid rgba(59, 158, 255, 0.1);
            padding-top: 16px;
        }

        .hint span {
            background: rgba(59, 158, 255, 0.15);
            padding: 2px 8px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.7rem;
            margin: 0 2px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <h1>⚡ Neural Factory</h1>
                <p>Secure authentication · AI‑driven access</p>
            </div>

            <div class="input-group">
                <label>🔑 Badge / ID</label>
                <input type="text" id="userId" placeholder="e.g., ADMIN, W001, M001" autocomplete="off">
            </div>

            <div class="input-group">
                <label>🎭 Role</label>
                <select id="userRole" onchange="handleRoleChange()">
                    <option value="admin">👑 Operations Director (Admin)</option>
                    <option value="worker">🔧 Production Worker</option>
                    <option value="mechanic">🔩 Maintenance Mechanic</option>
                    <option value="truck">🚚 Truck Driver</option>
                    <option value="warehouse">🏭 Warehouse Staff</option>
                </select>
            </div>

            <!-- Truck Driver extra fields -->
            <div class="extra-fields" id="truckFields">
                <div class="role-badge">🚚 Truck Driver Details</div>
                <div class="input-group">
                    <label>Driver Full Name</label>
                    <input type="text" id="driverName" placeholder="e.g., Ravi Kumar">
                </div>
                <div class="input-group">
                    <label>Truck Capacity (units)</label>
                    <input type="number" id="truckCapacity" placeholder="e.g., 500" min="1">
                </div>
            </div>

            <!-- Warehouse extra fields -->
            <div class="extra-fields" id="warehouseFields">
                <div class="role-badge">🏭 Warehouse Access</div>
                <div class="input-group">
                    <label>Warehouse Zone</label>
                    <select id="warehouseZone">
                        <option value="raw">Raw Materials</option>
                        <option value="finished">Finished Goods</option>
                        <option value="dispatch">Dispatch Bay</option>
                    </select>
                </div>
            </div>

            <button onclick="attemptLogin()">🔓 Authenticate &amp; Enter</button>
            <div id="errorMsg" class="error"></div>

            <div class="hint">
                💡 Test credentials:<br>
                <span>ADMIN</span> (admin) · <span>W001</span> (worker) · <span>M001</span> (mechanic)
                · <span>T001</span> (truck) · <span>WH001</span> (warehouse)
            </div>
        </div>
    </div>

    <script>
        const PLACEHOLDERS = {
            admin: 'e.g., ADMIN',
            worker: 'e.g., W001',
            mechanic: 'e.g., M001',
            truck: 'e.g., T001',
            warehouse: 'e.g., WH001'
        };

        function handleRoleChange() {
            const role = document.getElementById('userRole').value;
            document.getElementById('truckFields').classList.toggle('visible', role === 'truck');
            document.getElementById('warehouseFields').classList.toggle('visible', role === 'warehouse');
            document.getElementById('userId').placeholder = PLACEHOLDERS[role] || 'Enter Badge ID';
        }

        async function attemptLogin() {
            const userId = document.getElementById('userId').value.trim();
            const role = document.getElementById('userRole').value;
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';

            if (!userId) {
                err.style.display = 'block';
                err.innerText = '❌ Please enter your badge ID';
                return;
            }

            const btn = document.querySelector('button');
            const orig = btn.innerText;
            btn.innerText = '⏳ Authenticating...';
            btn.disabled = true;

            try {
                // ---------- Truck Driver ----------
                if (role === 'truck') {
                    const name = document.getElementById('driverName').value.trim();
                    const cap = document.getElementById('truckCapacity').value;
                    if (!name || !cap) {
                        err.style.display = 'block';
                        err.innerText = '❌ Please fill in your name and truck capacity';
                        btn.innerText = orig; btn.disabled = false;
                        return;
                    }
                    const res = await fetch('/api/truck/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ truck_id: userId, driver_name: name, capacity: parseInt(cap) })
                    });
                    const data = await res.json();
                    if (res.ok && !data.error) {
                        window.location.href = '/truck';
                    } else {
                        err.style.display = 'block';
                        err.innerText = '❌ ' + (data.error || 'Truck login failed');
                        btn.innerText = orig; btn.disabled = false;
                    }
                    return;
                }

                // ---------- Warehouse ----------
                if (role === 'warehouse') {
                    const zone = document.getElementById('warehouseZone').value;
                    const res = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: userId, role: 'warehouse', zone })
                    });
                    const data = await res.json();
                    if (data.success) {
                        window.location.href = data.redirect || '/warehouse';
                    } else {
                        err.style.display = 'block';
                        err.innerText = '❌ ' + (data.message || 'Access denied');
                        btn.innerText = orig; btn.disabled = false;
                    }
                    return;
                }

                // ---------- All other roles ----------
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: userId, role })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    err.style.display = 'block';
                    err.innerText = '❌ ' + (data.message || 'Access denied');
                    btn.innerText = orig; btn.disabled = false;
                }

            } catch (e) {
                err.style.display = 'block';
                err.innerText = '❌ Network error – cannot reach authentication service';
                btn.innerText = orig; btn.disabled = false;
            }
        }

        document.getElementById('userId').addEventListener('keypress', e => {
            if (e.key === 'Enter') attemptLogin();
        });
    </script>
</body>

</html>
