<!DOCTYPE html>
<html>
<head>
    <title>Manual Allocation Override - Smart Factory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .machine-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; transition: 0.2s;}
        .machine-card:hover { box-shadow: 0px 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Worker Manual Allocation (Admin Override)</h3>
                <a href="/" class="btn btn-sm btn-light">Back to Dashboard</a>
            </div>
            <div class="card-body">
                <div class="alert alert-warning">
                    <strong>Warning:</strong> Any manual assignments set here will take priority and bypass the RL engine's scheduling for the selected machine. 
                </div>
                
                <div class="row" id="machinesGrid">
                    Loading machine states...
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let workersList = [];
        
        async function init() {
            try {
                // Fetch workers
                const wRes = await fetch('/api/workers');
                workersList = await wRes.json();
                
                // Fetch stats (which contains raw machines) and current allocations
                const sRes = await fetch('/api/stats');
                const stats = await sRes.json();
                
                const aRes = await fetch('/api/alloc');
                const allocs = await aRes.json();
                
                renderGrid(stats.machines || [], allocs);
            } catch (e) {
                document.getElementById('machinesGrid').innerHTML = `<div class="alert alert-danger">Error loading data: ${e.message}</div>`;
            }
        }
        
        function renderGrid(machines, allocs) {
            const grid = document.getElementById('machinesGrid');
            grid.innerHTML = '';
            
            if (machines.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted">No machines found on floor.</div>';
                return;
            }
            
            machines.forEach(m => {
                const assigned = allocs.find(a => a.machine_id === m.id);
                const currentWorkerName = assigned ? assigned.operator : "Unassigned";
                
                const workerOpts = workersList.map(w => 
                    `<option value="${w.id}">${w.name}</option>`
                ).join('');
                
                const html = `
                <div class="col-md-4">
                    <div class="machine-card bg-white">
                        <h5 class="text-primary">${m.name || m.type} <span class="badge bg-secondary" style="font-size:0.7em">${m.id}</span></h5>
                        <p class="mb-2" style="font-size:0.9em">
                            <strong>Health:</strong> ${Math.round(m.health * 100)}% <br>
                            <strong>Current Role:</strong> ${currentWorkerName}
                        </p>
                        
                        <div class="d-flex align-items-center mt-3">
                            <select id="sel_${m.id}" class="form-select form-select-sm border-danger" style="margin-right: 10px;">
                                <option value="">Select manual worker...</option>
                                ${workerOpts}
                            </select>
                            <button class="btn btn-sm btn-danger px-3 fw-bold" onclick="forceAssign('${m.id}')">FORCE</button>
                        </div>
                        <div id="res_${m.id}" class="mt-2 text-success" style="font-size:0.85em;"></div>
                    </div>
                </div>
                `;
                grid.innerHTML += html;
            });
        }
        
        async function forceAssign(machineId) {
            const workerId = document.getElementById(`sel_${machineId}`).value;
            const resDiv = document.getElementById(`res_${machineId}`);
            
            if (!workerId) {
                resDiv.className = "mt-2 text-danger";
                resDiv.innerText = "Please select a worker.";
                return;
            }
            
            resDiv.className = "mt-2 text-muted";
            resDiv.innerText = "Locking...";
            
            try {
                const res = await fetch('/api/assign', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ worker_id: workerId, machine_id: machineId })
                });
                
                const data = await res.json();
                if (res.ok && data.message) {
                    resDiv.className = "mt-2 text-success";
                    resDiv.innerText = "Override Locked!";
                    // refresh state after 1 sec
                    setTimeout(init, 1000);
                } else {
                    resDiv.className = "mt-2 text-danger";
                    resDiv.innerText = data.error || data.message || "Failed.";
                }
            } catch (e) {
                resDiv.className = "mt-2 text-danger";
                resDiv.innerText = e.message;
            }
        }

        init();
    </script>
</body>
</html>
